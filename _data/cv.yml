    Experience:
      - type: research
        position: De novo sequencing of long, highly charged peptides
        company: "Advisor: Prof. Pavel Pevzner"
        department: Computer Science and Engineering, UC San Diego
        location: San Diego, CA
        start_date: 2025-09
        end_date: present
        period: September 2025–present
        summary: I combine mass spectrometry, algorithm design, and protein language
          models to reconstruct long peptide sequences.
        highlights:
          - I established a framework that integrates two-dimensional mass–mass spectrometry
            (MMS) fragment correlations into de novo sequencing to constrain candidate
            sequences and reconstruct long peptides.
          - I designed an approach to the antisymmetric-path problem that enforces consistent
            peak assignments and integrates MMS correlations for peptides that challenge
            conventional tandem mass spectrometry.
          - I am fine-tuning protein language models to recover missing residues in gapped
            MMS reconstructions by combining learned sequence priors with spectral evidence.
      - type: research
        position: Single-cell gene regulatory networks
        company: "Advisor: Prof. Bing Ren"
        department: Institute for Genomic Medicine, UC San Diego
        location: San Diego, CA
        start_date: 2024-01
        end_date: 2026-03
        period: January 2024–March 2026
        summary: I worked on transformer-based methods to infer gene regulatory networks
          and study the effects of regulatory variation.
        highlights:
          - I restructured gene regulatory network inference algorithms to incorporate
            topologically associating domains and chromatin marks at cis-regulatory elements
            within a transformer-based architecture.
          - I worked on an LLM-based framework to predict how single-nucleotide polymorphisms
            within cis-regulatory elements affect regulatory networks and downstream gene
            expression.
          - I designed and implemented single-cell benchmarks to evaluate regulatory interactions
            across cellular contexts, with a focus on predictive robustness and interpretability.
